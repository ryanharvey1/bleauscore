<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%97%3C/text%3E%3C/svg%3E" />
    <title>BleauScore · Fontainebleau climbing forecast</title>
    <meta name="description" content="Live climbing-conditions score for Fontainebleau sandstone: temperature, humidity, recent rain and a hard no-go when the rock is damp." />
    <meta property="og:title" content="BleauScore — is Font climbable today? · Bleau est-il grimpable ?" />
    <meta property="og:description" content="Live climbing score for Rocher Canon, Bas Cuvier, Franchard Isatis and Apremont from the Open-Meteo forecast. In English and French." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;0,800;1,500&family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: light dark;
        /* Sandstone & slate — warm rock, cool sky. */
        --bg:#e8edf0;
        --bg-deep:#dbe4e8;
        --surface:#ffffff;
        --surface-2:#f1f5f6;
        --ink:#162834;
        --ink-2:#3d5566;
        --muted:#6e8492;
        --line:#cfdce1;
        --line-strong:#afc6ce;
        --forest:#26536b;
        --forest-deep:#ffffff;
        --forest-ink:#162834;
        --forest-muted:#6e8492;
        --sand:#c05f1e;
        --sand-bright:#e07f24;
        --star:#de8620;
        --star-track:#dce5e8;
        --go:#14805e;
        --go-bg:#d6eee2;
        --go-ink:#0c5a40;
        --marg:#8f6200;
        --marg-bg:#fdf0c2;
        --marg-ink:#6b4a00;
        --nogo:#b23a24;
        --nogo-bg:#fbe3dc;
        --nogo-ink:#7e2817;
        --hero-bg:#ffffff;
        --hero-ink:#162834;
        --hero-muted:#6e8492;
        --hero-line:#dde7ea;
        --hero-fact-bg:#f7f2e9;
        --hero-ring:rgba(192,95,30,.10);
        --shadow:0 1px 2px rgba(22,40,52,.06),0 10px 28px -18px rgba(22,40,52,.28);
        --radius-hero:22px;
        --radius-card:14px;
        --radius-row:10px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#111a21;
          --bg-deep:#0c1318;
          --surface:#1b2831;
          --surface-2:#22313c;
          --ink:#eaf1f4;
          --ink-2:#c2d2da;
          --muted:#8aa0ac;
          --line:#2e424e;
          --line-strong:#416173;
          --forest:#33718f;
          --forest-deep:#1e3442;
          --forest-ink:#f0f6f8;
          --forest-muted:#a9c2ce;
          --sand:#ea9a4b;
          --sand-bright:#f0a83e;
          --star:#eba93f;
          --star-track:#314551;
          --go:#3ecf95;
          --go-bg:#173a2e;
          --go-ink:#8fe8bf;
          --marg:#e8c15a;
          --marg-bg:#3a3312;
          --marg-ink:#f0d189;
          --nogo:#f08a72;
          --nogo-bg:#3d211a;
          --nogo-ink:#f5b3a2;
          --hero-bg:#1e3442;
          --hero-ink:#f0f6f8;
          --hero-muted:#a9c2ce;
          --hero-line:rgba(255,255,255,.14);
          --hero-fact-bg:#1e3442;
          --hero-ring:rgba(255,255,255,.06);
          --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7);
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:16px;
        line-height:1.5;
      }
      .wrap{max-width:1060px;margin:0 auto;padding:0 18px 56px}

      /* ---------- slim top bar ---------- */
      .topbar{
        display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
        padding:16px 0 12px;border-bottom:2px solid var(--ink);
      }
      .wordmark{
        font-family:"Bitter",serif;font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1;
      }
      .wordmark em{font-style:normal;color:var(--sand)}
      .topbar-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
      .updated{font-size:12.5px;color:var(--muted);font-weight:500}
      .updated b{color:var(--ink-2);font-weight:700}
      .btn{
        appearance:none;border:1px solid var(--line-strong);background:var(--surface);
        color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;
        padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
      }
      .btn:hover{border-color:var(--ink-2)}
      .btn:focus-visible,.sector-tab:focus-visible,.day-card:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
      .btn svg{width:14px;height:14px;flex:none}
      .btn.spinning svg{animation:spin 1s linear infinite}
      .btn[disabled]{opacity:.55;cursor:wait}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.btn.spinning svg{animation:none}}

      /* refresh outcome notice */
      .refresh-note{
        margin-top:14px;border-radius:var(--radius-row);padding:11px 15px;
        font-size:14px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);
      }
      .refresh-note b{color:var(--ink);font-weight:800}
      .refresh-note.err{background:var(--nogo-bg);border-color:var(--nogo);color:var(--nogo-ink)}
      .refresh-note.err b{color:var(--nogo-ink)}
      .refresh-note.ok{background:var(--go-bg);border-color:var(--go);color:var(--go-ink)}
      .refresh-note.ok b{color:var(--go-ink)}

      .lede{margin:14px 0 0;font-size:14.5px;color:var(--ink-2);max-width:62ch}
      .lede b{color:var(--ink)}

      /* ---------- sector picker ---------- */
      .picker-label{
        margin:26px 0 10px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
        display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
      }
      .picker-label .coords{letter-spacing:0;text-transform:none;font-weight:600;font-size:12.5px}
      .sector-tabs{display:flex;flex-wrap:wrap;gap:8px}
      .sector-tab{
        appearance:none;cursor:pointer;font:inherit;text-align:left;
        border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
        border-radius:12px;padding:10px 16px 9px;min-width:0;
      }
      .sector-tab .s-name{display:block;font-weight:800;font-size:15.5px;line-height:1.2}
      .sector-tab .s-note{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
      .sector-tab[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
      .sector-tab[aria-pressed="true"] .s-note{color:#c3d9e2}

      /* ---------- hero verdict ---------- */
      .hero{
        margin-top:18px;background:var(--hero-bg);color:var(--hero-ink);
        border:1px solid var(--line);border-top:4px solid var(--sand);
        border-radius:var(--radius-hero);padding:26px 28px 24px;box-shadow:var(--shadow);
        position:relative;overflow:hidden;
      }
      .hero::after{
        content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
        border:34px solid var(--hero-ring);pointer-events:none;
      }
      .hero-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1}
      .hero-day{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted)}
      .hero-day strong{display:block;font-family:"Bitter",serif;font-size:27px;letter-spacing:0;text-transform:none;color:var(--hero-ink);margin-top:3px;line-height:1.15}
      .verdict-badge{
        display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;
        padding:9px 16px;border-radius:999px;white-space:nowrap;
      }
      .verdict-badge .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
      .verdict-badge.go{background:var(--go-bg);color:var(--go-ink)}
      .verdict-badge.marginal{background:var(--marg-bg);color:var(--marg-ink)}
      .verdict-badge.nogo{background:var(--nogo-bg);color:var(--nogo-ink)}
      .hero-score{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
      .stars-wrap{line-height:1}
      .stars{position:relative;display:inline-block;font-size:52px;line-height:1;letter-spacing:4px;font-family:"Archivo",sans-serif}
      .stars .track{color:var(--star-track)}
      .stars .fill{position:absolute;left:0;top:0;color:var(--sand-bright);overflow:hidden;white-space:nowrap}
      .score-num{font-family:"Bitter",serif;font-weight:800;font-size:54px;line-height:.95}
      .score-num small{font-size:24px;color:var(--hero-muted);font-weight:700}
      .hero-verdict-text{font-size:17px;font-weight:600;max-width:34ch;line-height:1.4}
      .hero-facts{
        display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hero-line);
        border:1px solid var(--hero-line);border-radius:12px;overflow:hidden;margin-top:22px;position:relative;z-index:1;
      }
      .hero-fact{background:var(--hero-fact-bg);padding:12px 14px;min-width:0}
      .hero-fact .k{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--hero-muted)}
      .hero-fact .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
      .hero-fact .v small{font-size:12.5px;font-weight:600;color:var(--hero-muted)}

      /* ---------- day cards ---------- */
      .days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
      .day-card{
        appearance:none;cursor:pointer;font:inherit;text-align:left;width:100%;
        background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-card);
        padding:14px 15px 12px;box-shadow:var(--shadow);color:var(--ink);
      }
      .day-card:hover{border-color:var(--line-strong)}
      .day-card[aria-pressed="true"]{border-color:var(--sand);box-shadow:0 0 0 1.5px var(--sand),var(--shadow)}
      .day-card .d-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
      .day-card .d-date{font-family:"Bitter",serif;font-weight:700;font-size:16.5px;margin-top:1px}
      .day-card .d-score{display:flex;align-items:baseline;gap:7px;margin-top:8px}
      .day-card .d-stars{font-family:"Bitter",serif;font-weight:800;font-size:27px;line-height:1}
      .day-card .d-stars small{font-size:14px;color:var(--muted);font-weight:700}
      .day-card .d-mini{position:relative;display:inline-block;font-size:11px;letter-spacing:1px;line-height:1;color:var(--star-track)}
      .day-card .d-mini .fill{position:absolute;left:0;top:0;color:var(--star);overflow:hidden;white-space:nowrap}
      .day-card .d-verdict{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px}
      .day-card .d-verdict .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
      .d-verdict.go{background:var(--go-bg);color:var(--go-ink)}
      .d-verdict.marginal{background:var(--marg-bg);color:var(--marg-ink)}
      .d-verdict.nogo{background:var(--nogo-bg);color:var(--nogo-ink)}
      .day-card .d-window{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

      /* ---------- detail panels ---------- */
      .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px;align-items:start}
      .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:20px 20px 16px}
      .panel h2{font-family:"Bitter",serif;font-size:19px;font-weight:800;margin:0 0 4px;line-height:1.25}
      .panel .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
      .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
      .stat{padding:11px 12px 11px 0;border-top:1px solid var(--line)}
      .stat .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
      .stat .v{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
      .stat .v small{font-size:13px;font-weight:600;color:var(--muted)}
      .stat .note{font-size:12.5px;color:var(--ink-2);margin-top:2px}
      .peak-line{
        margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-row);
        padding:11px 13px;font-size:13.5px;color:var(--ink-2);
      }
      .peak-line b{color:var(--ink)}

      /* component bars */
      .comp{margin-top:6px}
      .comp-row{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
      .comp-row:first-child{border-top:none}
      .comp-name{font-size:13.5px;font-weight:700}
      .comp-name span{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
      .comp-bar{height:9px;border-radius:99px;background:var(--star-track);overflow:hidden}
      .comp-bar i{display:block;height:100%;background:var(--sand);border-radius:99px}
      .comp-val{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

      /* ---------- hourly ---------- */
      .hourly-panel{margin-top:14px}
      .hour-head,.hour-row{
        display:grid;grid-template-columns:52px 74px 1fr;gap:10px;align-items:center;
      }
      .hour-head{
        font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
        padding:0 12px 8px;
      }
      .hour-head .h-metrics{text-align:right}
      .hour-row{
        background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-row);
        padding:9px 12px;margin-top:6px;
      }
      .hour-row.is-best{border-color:var(--sand);box-shadow:0 0 0 1px var(--sand)}
      .hour-row.is-damp{border-color:var(--nogo);background:var(--nogo-bg)}
      .h-time{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
      .h-time .best-tag{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--sand);text-transform:uppercase}
      .h-score{display:flex;align-items:center;gap:8px;min-width:0}
      .h-bar{flex:1;height:8px;border-radius:99px;background:var(--star-track);overflow:hidden;min-width:34px}
      .h-bar i{display:block;height:100%;border-radius:99px}
      .h-bar i.go{background:var(--go)} .h-bar i.marginal{background:var(--sand)} .h-bar i.nogo{background:var(--nogo)}
      .h-num{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
      .h-metrics{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;line-height:1.45}
      .h-metrics b{color:var(--ink)}
      .damp-badge{
        display:inline-block;font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--nogo-ink);
        background:var(--surface);border:1px solid var(--nogo);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px;
      }
      @media (prefers-color-scheme: dark){.damp-badge{background:transparent}}

      /* ---------- how it works / footer ---------- */
      .how{margin-top:26px;border-top:2px solid var(--ink);padding-top:18px}
      .how h2{font-family:"Bitter",serif;font-size:20px;font-weight:800;margin:0 0 8px}
      .how-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 34px;font-size:14px;color:var(--ink-2)}
      .how-grid p{margin:6px 0}
      .how-grid b{color:var(--ink)}
      .rule-box{
        margin-top:12px;background:var(--nogo-bg);color:var(--nogo-ink);border-radius:var(--radius-row);
        padding:12px 15px;font-size:14px;font-weight:600;
      }
      .rule-box b{font-weight:800}
      footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:8px 20px;flex-wrap:wrap}
      footer a{color:var(--ink-2);font-weight:600}

      /* ---------- states ---------- */
      .state{
        margin-top:18px;background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--radius-card);
        padding:34px 22px;text-align:center;
      }
      .state h2{font-family:"Bitter",serif;margin:0 0 6px;font-size:20px}
      .state p{margin:0 auto 16px;color:var(--muted);max-width:46ch;font-size:14.5px}
      .spinner{
        width:30px;height:30px;margin:0 auto 14px;border-radius:50%;
        border:3.5px solid var(--line);border-top-color:var(--sand);animation:spin 0.9s linear infinite;
      }
      @media (prefers-reduced-motion: reduce){.spinner{animation:none}}
      [hidden]{display:none !important}

      /* ---------- responsive ---------- */
      @media (max-width:820px){
        .grid-2{grid-template-columns:1fr}
        .how-grid{grid-template-columns:1fr}
        .hero-facts{grid-template-columns:1fr 1fr}
      }
      @media (max-width:560px){
        .wrap{padding:0 13px 44px}
        .hero{padding:20px 18px 18px}
        .stars{font-size:40px}
        .score-num{font-size:44px}
        .days{grid-template-columns:1fr 1fr}
        .sector-tab{flex:1 1 calc(50% - 8px)}
        .hour-head{display:none}
        .hour-row{grid-template-columns:46px 64px 1fr;gap:8px;padding:9px 10px}
        .h-metrics{font-size:11.5px}
        .comp-row{grid-template-columns:100px 1fr 46px;gap:8px}
      }
      /* language switch */
      .lang-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
      .lang-toggle button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.06em;padding:8px 11px;cursor:pointer}
      .lang-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
      .lang-toggle button:focus-visible{outline:3px solid var(--sand);outline-offset:-3px}
      .score-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:6px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="wordmark">Bleau<em>Score</em></div>
        <div class="topbar-meta">
          <span class="updated" id="updatedAt" data-i18n="updatedDefault">BleauScore · Fontainebleau sandstone</span>
          <div class="lang-toggle" role="group" data-i18n-aria="langAria" aria-label="Language">
            <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
          </div>
          <button class="btn" id="refreshBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            <span data-i18n="refresh">Refresh</span>
          </button>
        </div>
      </header>

      <div class="refresh-note" id="refreshNote" role="status" hidden></div>

      <p class="lede" data-i18n-html="lede"></p>

      <div class="picker-label"><span data-i18n="sector">Sector</span> <span class="coords" id="sectorCoords"></span></div>
      <div class="sector-tabs" id="sectorTabs" role="group" data-i18n-aria="sectorsAria"></div>

      <div class="state" id="loadingState">
        <div class="spinner" aria-hidden="true"></div>
        <h2 data-i18n="loadingTitle"></h2>
        <p data-i18n="loadingText"></p>
      </div>

      <div class="state" id="errorState" hidden>
        <h2 data-i18n="errorTitle"></h2>
        <p id="errorMsg"></p>
        <button class="btn" id="retryBtn" type="button" data-i18n="retry"></button>
      </div>

      <main id="content" hidden>
        <section class="hero" aria-live="polite">
          <div class="hero-top">
            <div class="hero-day"><span id="heroDayLabel"></span><strong id="heroSector"></strong></div>
            <span class="verdict-badge go" id="heroBadge"><span class="dot"></span><span id="heroBadgeText"></span></span>
          </div>
          <div class="hero-score">
            <div class="stars-wrap">
              <div class="score-label">BleauScore</div>
              <div class="stars" aria-hidden="true"><span class="track">★★★★★</span><span class="fill" id="starFill">★★★★★</span></div>
            </div>
            <div class="score-num"><span id="heroStars">–</span><small>/5</small></div>
            <p class="hero-verdict-text" id="heroVerdict">—</p>
          </div>

        var start = bestWindow[0];
        var v = verdictFor(stars, dampHours > 0);
        var compAvg = { temp: 0, humidity: 0, dryness: 0, wind: 0, sun: 0 };
        bestWindow.forEach(function (h) {
          var c = components(h);
          compAvg.temp += c.temp; compAvg.humidity += c.humidity; compAvg.dryness += c.dryness; compAvg.wind += c.wind; compAvg.sun += c.sun;
        });
        Object.keys(compAvg).forEach(function (k) { compAvg[k] /= bestWindow.length; });
        return {
          dateStr: dateStr, climb: climb, bestWindow: bestWindow, best: best,
          stars: stars, bestRh: bestRh, dampHours: dampHours,
          rain24: start.rain24, rain48: start.rain48,
          verdict: v, compAvg: compAvg
        };
      }

      /* ---------- dates & numbers ---------- */
      function parisTodayStr() {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
      }
      function addDays(dateStr, n) {
        var p = dateStr.split("-");
        var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
        return d.toISOString().slice(0, 10);
      }
      function dayLabel(dateStr, idx) {
        var d = new Date(dateStr + "T12:00:00Z");
        var weekday = new Intl.DateTimeFormat(loc(), { timeZone: "Europe/Paris", weekday: "long" }).format(d);
        var nice = new Intl.DateTimeFormat(loc(), { timeZone: "Europe/Paris", day: "numeric", month: "long" }).format(d);
        if (idx === 0) return { name: t("today"), full: t("today") + " · " + weekday + " " + nice };
        if (idx === 1) return { name: t("tomorrow"), full: cap(weekday) + " " + nice };
        return { name: weekday, full: cap(weekday) + " " + nice };
      }
      function shortDate(dateStr) {
        return new Intl.DateTimeFormat(loc(), { timeZone: "Europe/Paris", day: "numeric", month: "short" }).format(new Date(dateStr + "T12:00:00Z"));
      }
      function parisTimeStr(d) {
        return new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit" }).format(d);
      }
      // Locale-aware fixed decimals: 4.4 in English, 4,4 in French.
      function fmt(n, dec) {
        if (n === null || n === undefined || isNaN(n)) return "–";
        return n.toLocaleString(loc(), { minimumFractionDigits: dec, maximumFractionDigits: dec });
      }

      /* ---------- state & fetching ---------- */
      var cache = {};           // sectorId -> { fetchedAt, days: [scoreDay...] }
      var currentSector = SECTORS[0];
      var currentDay = 0;
      var lastError = null;     // { key, vars } for re-rendering the error in another language

      var els = {};
      ["updatedAt","refreshBtn","refreshNote","sectorCoords","sectorTabs","loadingState","errorState","errorMsg","retryBtn","content",
       "heroDayLabel","heroSector","heroBadge","heroBadgeText","heroStars","starFill","heroVerdict",
       "factWindow","factRh","factRain24","factRain48","dayCards","detailTitle","statWindow","statWindowNote",
       "statRh","statRain24","statRain24Note","statRain48","statDamp","statPeak","statPeakNote","peakLine",
       "compBars","hourRows"].forEach(function (id) { els[id] = document.getElementById(id); });

      function apiUrl(sector) {
        return "https://api.open-meteo.com/v1/forecast?latitude=" + sector.lat + "&longitude=" + sector.lon +
          "&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,cloud_cover,wind_speed_10m" +
          "&past_days=2&forecast_days=5&timezone=Europe%2FParis&_=" + Date.now();
      }
      function fetchErr(key, vars) { var e = new Error(key); e.i18n = { key: key, vars: vars }; return e; }

      function fetchForecastOnce(sector) {
        var opts = { cache: "no-store" };
        var ctrl = null, timer = null;
        if (typeof AbortController !== "undefined") {
          ctrl = new AbortController();
          opts.signal = ctrl.signal;
          timer = setTimeout(function () { ctrl.abort(); }, 12000);
        }
        return fetch(apiUrl(sector), opts)
          .then(function (r) {
            if (timer) clearTimeout(timer);
            if (!r.ok) throw fetchErr("err.http", { s: r.status });
            return r.json();
          })
          .catch(function (err) {
            if (timer) clearTimeout(timer);
            if (err && err.i18n) throw err;
            if (err && err.name === "AbortError") throw fetchErr("err.timeout");
            throw fetchErr("err.network");
          });
      }
      function fetchForecast(sector) {
        return fetchForecastOnce(sector).catch(function () {
          // One retry after a short pause — transient drops are common on mobile.
          return new Promise(function (resolve) { setTimeout(resolve, 1500); })
            .then(function () { return fetchForecastOnce(sector); });
        });
      }

      /* ---------- refresh outcome notice ---------- */
      var noteTimer = null;
      function showNote(kind, bold, rest, autoHideMs) {
        if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; }
        els.refreshNote.replaceChildren();
        els.refreshNote.className = "refresh-note" + (kind ? " " + kind : "");
        var b = document.createElement("b"); b.textContent = bold;
        els.refreshNote.appendChild(b);
        els.refreshNote.appendChild(document.createTextNode(rest));
        els.refreshNote.hidden = false;
        if (autoHideMs) noteTimer = setTimeout(function () { els.refreshNote.hidden = true; }, autoHideMs);
      }
      function hideNote() {
        if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; }
        els.refreshNote.hidden = true;
      }

      function showState(which) {
        els.loadingState.hidden = which !== "loading";
        els.errorState.hidden = which !== "error";
        els.content.hidden = which !== "content";
      }
      function renderError() {
        if (!lastError) return;
        els.errorMsg.textContent = t("errorWith", { e: t(lastError.key, lastError.vars) });
      }

      // One fetch per sector at a time; switching sectors mid-fetch is always allowed.
      var inFlight = {};        // sectorId -> true while its fetch runs
      function syncRefreshBtn() {
        var busy = !!inFlight[currentSector.id];
        els.refreshBtn.classList.toggle("spinning", busy);
        els.refreshBtn.disabled = busy;
      }
      function loadSector(sector, force) {
        var switching = sector.id !== currentSector.id;
        currentSector = sector;
        renderTabs();
        els.sectorCoords.textContent = sector.lat.toFixed(4) + ", " + sector.lon.toFixed(4) + " · bleau.info";
        syncUrl();
        syncRefreshBtn();
        if (switching) hideNote();
        var cached = cache[sector.id];
        if (inFlight[sector.id]) {
          // Already loading this sector: show what we have and let that fetch finish.
          if (cached) render(cached); else showState("loading");
          return Promise.resolve();
        }
        if (!force && cached && !isStale(cached)) {
          render(cached);
          return Promise.resolve();
        }
        // Keep showing older data while a refetch runs; otherwise spin.
        if (cached) render(cached); else showState("loading");
        inFlight[sector.id] = true;
        syncRefreshBtn();
        if (force) showNote("", t("noteRefreshingB"), t("noteRefreshing"), 0);
        // Re-anchor "today" at fetch time so a page left open overnight scores the right days.
        var today = parisTodayStr();
        var dates = [];
        for (var di = 0; di < 4; di++) dates.push(addDays(today, di));
        return fetchForecast(sector)
          .then(function (data) {
            var rows = buildRows(data);
            var days = dates.map(function (d) { return scoreDay(rows, d); });
            if (days.some(function (d) { return !d; })) throw fetchErr("err.coverage");
            var entry = { days: days, fetchedAt: new Date() };
            cache[sector.id] = entry;
            delete inFlight[sector.id];
            if (sector.id !== currentSector.id) return;   // user moved on; data is cached for later
            syncRefreshBtn();
            render(entry);
            if (force) showNote("ok", t("noteUpdatedB", { t: parisTimeStr(entry.fetchedAt) }), t("noteUpdated"), 8000);
            else hideNote();
          })
          .catch(function (err) {
            delete inFlight[sector.id];
            if (sector.id !== currentSector.id) return;
            syncRefreshBtn();
            var existing = cache[sector.id];
            if (existing) {
              existing.liveFailed = true;
              render(existing);
              showNote("err", t("noteFailedB"), t("noteFailedHave", { t: parisTimeStr(existing.fetchedAt) }), 0);
            } else {
              lastError = (err && err.i18n) || { key: "err.network" };
              renderError();
              showState("error");
              showNote("err", t("noteFailedB"), t("noteFailedNone"), 0);
            }
          });
      }

      /* ---------- rendering ---------- */
      function applyStatic() {
        document.documentElement.lang = lang;
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
        document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
        document.querySelectorAll(".lang-toggle button").forEach(function (b) {
          b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
        });
      }

      function renderTabs() {
        els.sectorTabs.replaceChildren();
        SECTORS.forEach(function (s) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "sector-tab";
          b.setAttribute("aria-pressed", s.id === currentSector.id ? "true" : "false");
          var n = document.createElement("span"); n.className = "s-name"; n.textContent = s.name;
          var nt = document.createElement("span"); nt.className = "s-note"; nt.textContent = t("note." + s.id);
          b.appendChild(n); b.appendChild(nt);
          b.addEventListener("click", function () { loadSector(s, false); });
          els.sectorTabs.appendChild(b);
        });
      }

      function windowRange(day) {
        var w = day.bestWindow;
        var start = w[0].timeStr;
        var endHour = w[w.length - 1].hour + 1;
        return start + " – " + (endHour < 10 ? "0" : "") + endHour + ":00";
      }
      // Same partial fill as the hero stars, so 4.5 shows four and a half stars, not five.
      function miniStars(el, stars) {
        el.replaceChildren();
        el.setAttribute("aria-hidden", "true");
        var track = document.createElement("span"); track.textContent = "★★★★★";
        var fill = document.createElement("span"); fill.className = "fill"; fill.textContent = "★★★★★";
        fill.style.width = (Math.max(0, Math.min(5, stars)) / 5 * 100) + "%";
        el.appendChild(track); el.appendChild(fill);
      }
      function valWithUnit(el, value, unit) {
        el.replaceChildren();
        el.appendChild(document.createTextNode(value));
        var s = document.createElement("small"); s.textContent = unit; el.appendChild(s);
      }

      function render(entry) {
        showState("content");
        els.updatedAt.replaceChildren();
        els.updatedAt.appendChild(document.createTextNode(t("fetched")));
        var b = document.createElement("b"); b.textContent = t("parisTime", { t: parisTimeStr(entry.fetchedAt) });
        els.updatedAt.appendChild(b);
        if (entry.liveFailed) els.updatedAt.appendChild(document.createTextNode(t("fetchedFailed")));

        // day cards
        els.dayCards.replaceChildren();
        entry.days.forEach(function (day, idx) {
          var lab = dayLabel(day.dateStr, idx);
          var card = document.createElement("button");
          card.type = "button";
          card.className = "day-card";
          card.setAttribute("aria-pressed", idx === currentDay ? "true" : "false");
          var dName = document.createElement("div"); dName.className = "d-name"; dName.textContent = lab.name;
          var dDate = document.createElement("div"); dDate.className = "d-date"; dDate.textContent = shortDate(day.dateStr);
          var dScore = document.createElement("div"); dScore.className = "d-score";
          var dStars = document.createElement("span"); dStars.className = "d-stars";
          dStars.textContent = fmt(day.stars, 1);
          var small = document.createElement("small"); small.textContent = "/5";
          dStars.appendChild(small);
          var dMini = document.createElement("span"); dMini.className = "d-mini"; miniStars(dMini, day.stars);
          dScore.appendChild(dStars); dScore.appendChild(dMini);
          var dVerdict = document.createElement("span"); dVerdict.className = "d-verdict " + day.verdict.kind;
          var dot = document.createElement("span"); dot.className = "dot";
          dVerdict.appendChild(dot);
          dVerdict.appendChild(document.createTextNode(day.dampHours > 0 ? t("dampCard") : t("short." + day.verdict.kind)));
          var dWindow = document.createElement("div"); dWindow.className = "d-window";
          dWindow.textContent = t("cardBest", { w: windowRange(day), rh: Math.round(day.bestRh) });
          card.appendChild(dName); card.appendChild(dDate); card.appendChild(dScore); card.appendChild(dVerdict); card.appendChild(dWindow);
          card.addEventListener("click", function () { currentDay = idx; render(entry); });
          els.dayCards.appendChild(card);
        });

        var day = entry.days[currentDay];
        var lab2 = dayLabel(day.dateStr, currentDay);

        // hero
        els.heroDayLabel.textContent = lab2.full;
        els.heroSector.textContent = currentSector.name;
        els.heroBadge.className = "verdict-badge " + day.verdict.kind;
        els.heroBadgeText.textContent = day.dampHours > 0 ? t("dampHero") : t("short." + day.verdict.kind);
        els.heroStars.textContent = fmt(day.stars, 1);
        els.starFill.style.width = (day.stars / 5 * 100) + "%";
        els.heroVerdict.textContent = t("verdict." + day.verdict.key);
        els.factWindow.textContent = windowRange(day);
        valWithUnit(els.factRh, Math.round(day.bestRh) + "", t("pctAvg"));
        valWithUnit(els.factRain24, fmt(day.rain24, 1), " mm");
        valWithUnit(els.factRain48, fmt(day.rain48, 1), " mm");

        // detail
        els.detailTitle.textContent = t("detailTitle", { d: lab2.full });
        els.statWindow.textContent = windowRange(day);
        els.statWindowNote.textContent = t("windowNote", { t: day.best.timeStr, s: fmt(day.best.score * 5, 1) });
        els.statRh.textContent = Math.round(day.bestRh) + (lang === "fr" ? NB + "%" : "%");
        valWithUnit(els.statRain24, fmt(day.rain24, 1) + " ", "mm");
        els.statRain24Note.textContent = day.rain24 <= 0 ? t("rainNone") : (day.rain24 <= 1 ? t("rainTrace") : t("rainSoak"));
        valWithUnit(els.statRain48, fmt(day.rain48, 1) + " ", "mm");
        els.statDamp.textContent = day.dampHours + " / 3";
        els.statPeak.textContent = day.best.timeStr;
        els.statPeakNote.textContent = t("peakNote", { s: fmt(day.best.score * 5, 1) });
        els.peakLine.replaceChildren();
        var pb = document.createElement("b"); pb.textContent = t("peakLabel", { t: day.best.timeStr });
        els.peakLine.appendChild(pb);
        els.peakLine.appendChild(document.createTextNode(t("peakLine", {
          temp: fmt(day.best.temp, 0), rh: Math.round(day.best.rh), dew: fmt(day.best.dew, 0),
          wind: fmt(day.best.wind, 0), cloud: Math.round(day.best.cloud)
        })));

        // component bars
        var comps = [
          { key: "temp", p: 35 }, { key: "humidity", p: 25 }, { key: "dryness", p: 25 },
          { key: "sun", p: 10 }, { key: "wind", p: 5 }
        ];
        els.compBars.replaceChildren();
        comps.forEach(function (c) {
          var val = day.compAvg[c.key];
          var row = document.createElement("div"); row.className = "comp-row";
          var nm = document.createElement("div"); nm.className = "comp-name"; nm.textContent = t("comp." + c.key);
          var wspan = document.createElement("span"); wspan.textContent = t("ofScore", { p: c.p }); nm.appendChild(wspan);
          var bar = document.createElement("div"); bar.className = "comp-bar";
          var fill = document.createElement("i"); fill.style.width = Math.round(val * 100) + "%";
          bar.appendChild(fill);
          var vv = document.createElement("div"); vv.className = "comp-val"; vv.textContent = fmt(val * 5, 1) + "/5";
          row.appendChild(nm); row.appendChild(bar); row.appendChild(vv);
          els.compBars.appendChild(row);
        });

        // hourly rows
        els.hourRows.replaceChildren();
        var bestSet = {};
        day.bestWindow.forEach(function (h) { bestSet[h.timeStr] = true; });
        day.climb.forEach(function (h) {
          var row = document.createElement("div");
          row.className = "hour-row" + (h.damp ? " is-damp" : (bestSet[h.timeStr] ? " is-best" : ""));
          var tCell = document.createElement("div"); tCell.className = "h-time"; tCell.textContent = h.timeStr;
          if (bestSet[h.timeStr] && !h.damp) {
            var tag = document.createElement("span"); tag.className = "best-tag"; tag.textContent = t("bestTag");
            tCell.appendChild(tag);
          }
          var sCell = document.createElement("div"); sCell.className = "h-score";
          var bar = document.createElement("div"); bar.className = "h-bar";
          var fill = document.createElement("i");
          var sv = h.score * 5;
          fill.className = h.damp ? "nogo" : (sv >= 3.5 ? "go" : (sv >= 2.5 ? "marginal" : "nogo"));
          fill.style.width = (sv / 5 * 100) + "%";
          bar.appendChild(fill);
          var num = document.createElement("span"); num.className = "h-num"; num.textContent = fmt(sv, 1);
          sCell.appendChild(bar); sCell.appendChild(num);
          var mCell = document.createElement("div"); mCell.className = "h-metrics";
          var line1 = document.createElement("b"); line1.textContent = fmt(h.temp, 0) + (lang === "fr" ? NB : " ") + "°C";
          mCell.appendChild(line1);
          mCell.appendChild(document.createTextNode(t("hourLine1", { rh: Math.round(h.rh), dew: fmt(h.dew, 0) })));
          mCell.appendChild(document.createElement("br"));
          mCell.appendChild(document.createTextNode(t("hourLine2", { w: fmt(h.wind, 0), c: Math.round(h.cloud), r: fmt(h.precip, 1) })));
          if (h.damp) {
            var badge = document.createElement("span"); badge.className = "damp-badge"; badge.textContent = t("dampBadge");
            mCell.appendChild(badge);
          }
          row.appendChild(tCell); row.appendChild(sCell); row.appendChild(mCell);
          els.hourRows.appendChild(row);
        });
      }

      /* ---------- language switch ---------- */
      function setLang(next) {
        if (!STR[next] || next === lang) return;
        lang = next;
        try { localStorage.setItem("bleauscore.lang", lang); } catch (e) {}
        applyStatic();
        renderTabs();
        syncUrl();
        hideNote();
        var c = cache[currentSector.id];
        if (!els.content.hidden && c) render(c);
        if (!els.errorState.hidden) renderError();
      }
      document.querySelectorAll(".lang-toggle button").forEach(function (b) {
        b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
      });

      /* ---------- shareable links & staying fresh ---------- */
      // URL carries both: ?lang=fr#apremont — so a shared link opens the same view.
      function syncUrl() {
        if (!history.replaceState) return;
        try {
          var u = new URL(location.href);
          u.searchParams.set("lang", lang);
          u.hash = currentSector.id;
          if (u.href !== location.href) history.replaceState(null, "", u.href);
        } catch (e) {}
      }
      var STALE_MS = 30 * 60 * 1000;
      function isStale(entry) { return Date.now() - entry.fetchedAt.getTime() > STALE_MS; }
      function sectorFromHash() {
        var id = (location.hash || "").replace(/^#/, "").toLowerCase();
        for (var i = 0; i < SECTORS.length; i++) if (SECTORS[i].id === id) return SECTORS[i];
        return null;
      }
      window.addEventListener("hashchange", function () {
        var s = sectorFromHash();
        if (s && s.id !== currentSector.id) loadSector(s, false);
      });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        var c = cache[currentSector.id];
        if (c && isStale(c)) loadSector(currentSector, true);
      });

      els.refreshBtn.addEventListener("click", function () { loadSector(currentSector, true); });
      els.retryBtn.addEventListener("click", function () { loadSector(currentSector, true); });

      applyStatic();
      loadSector(sectorFromHash() || currentSector, false);
    </script>
  </body>
</html>
